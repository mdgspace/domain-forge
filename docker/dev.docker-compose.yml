services:
  deno:
    container_name: df_backend
    image: df_backend
    restart: always
    volumes:
      - type: bind
        source: ./named_pipe
        target: /hostpipe
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: base
    ports:
      - "${PORT_BACKEND:-7000}:7000"
    environment:
      - PROMETHEUS_URL=http://mimir:8080/prometheus
      - MIMIR_URL=http://mimir:8080
      - LOKI_URL=http://loki:3100
      - GRAFANA_URL=http://grafana:3000
      - ALLOY_URL=http://alloy:12345
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    env_file:
      - ../src/backend/.env
    depends_on:
      - mimir
      - loki

  vue:
    container_name: df_frontend
    image: df_frontend
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: base
    ports:
      - "${PORT_FRONTEND:-8000}:8000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: df_cadvisor
    restart: unless-stopped
    mem_limit: 128m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"

  mimir:
    image: grafana/mimir:2.11.0
    container_name: df_mimir
    restart: unless-stopped
    mem_limit: 512m
    command:
      - "-config.file=/etc/mimir/mimir.yaml"
      - "-target=all"
    volumes:
      - ./mimir-config.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data/mimir
    depends_on:
      - cadvisor

  loki:
    image: grafana/loki:2.9.2
    container_name: df_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    depends_on:
      - cadvisor

  alloy:
    image: grafana/alloy:v1.0.0
    container_name: df_alloy
    user: root
    restart: unless-stopped
    volumes:
      - ./named_pipe/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./named_pipe/logs:/hostpipe/logs:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - mimir
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: df_grafana
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=debug
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      - GF_SECURITY_PASSWORD_POLICY_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_HEADER_NAME=X-JWT-Assertion
      - GF_AUTH_JWT_ENABLE_LOGIN_TOKEN=true
      - GF_AUTH_JWT_URL_LOGIN=true
      - GF_AUTH_JWT_PARAM_NAME=auth_token
      - GF_AUTH_JWT_JWK_SET_FILE=/etc/grafana/jwt/jwks.json
      - GF_AUTH_JWT_USERNAME_CLAIM=sub
      - GF_AUTH_JWT_EMAIL_CLAIM=email
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      - GF_AUTH_JWT_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH=contains(roles, 'superadmin') && 'Admin' || 'Viewer'
      - GF_AUTH_JWT_ORG_ATTRIBUTE_PATH=org_name
      - GF_USERS_AUTO_ASSIGN_ORG=false
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./named_pipe/jwt:/etc/grafana/jwt:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${PORT_GRAFANA:-3000}:3000"
    depends_on:
      - mimir
      - loki

volumes:
  mimir_data:
  loki_data:
  grafana_data:
