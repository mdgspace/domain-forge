version: "3.9"

services:
  deno:
    container_name: df_backend
    image: df_backend
    restart: always
    volumes:
      - type: bind
        source: ../docker/named_pipe
        target: /hostpipe
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: base
    ports:
      - "${PORT_BACKEND}:7000"
    env_file:
      - ../src/backend/.env
    depends_on:
      - prometheus
      - loki

  vue:
    container_name: df_frontend
    image: df_frontend
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: base
    ports:
      - "${PORT_FRONTEND}:8000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: df_cadvisor
    restart: unless-stopped
    mem_limit: 128m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: df_prometheus
    restart: unless-stopped
    mem_limit: 384m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.retention.size=256MB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor

  loki:
    image: grafana/loki:2.9.2
    container_name: df_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.0.0
    container_name: df_alloy
    user: root
    restart: unless-stopped
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../docker/named_pipe/logs:/hostpipe/logs:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: df_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_ENABLE_LOGIN_TOKEN=true
      - GF_AUTH_JWT_URL_LOGIN=true
      - GF_AUTH_JWT_URL_PARAMETER_NAME=auth_token
      - GF_AUTH_JWT_JWK_SET_FILE=/etc/grafana/jwt/jwks.json
      - GF_AUTH_JWT_USERNAME_CLAIM=sub
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      - GF_AUTH_JWT_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH=contains(roles, 'superadmin') && 'Admin' || 'Viewer'
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/jwt:/etc/grafana/jwt:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${PORT_GRAFANA:-3000}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
